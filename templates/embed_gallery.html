<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111; overflow-y: auto; }
  body { padding: 8px; font-family: monospace; color: #555; }

  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; font-size: 11px;
  }

  select {
    background: #1a1a1a; border: 1px solid #2a2a2a; color: #777;
    padding: 3px 8px; border-radius: 3px; font-size: 11px; cursor: pointer;
  }
  select:focus { outline: none; border-color: #3949ab; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
  }

  .card {
    background: #1a1a1a; border: 1px solid #222; border-radius: 4px; overflow: hidden;
    transition: border-color .15s;
  }
  .card:hover { border-color: #333; }
  .card a { display: block; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .card .ts { padding: 4px 6px; font-size: 10px; color: #444; }

  .empty { color: #333; font-size: 13px; padding: 24px; text-align: center; }
</style>
</head>
<body>

<div class="toolbar">
  <span>{{ snaps|length }} snapshots</span>
  <select onchange="location.href='/embed/gallery?limit='+this.value">
    {% for n in [5, 10, 20, 30] %}
    <option value="{{ n }}" {% if limit == n %}selected{% endif %}>Show {{ n }}</option>
    {% endfor %}
  </select>
</div>

{% if snaps %}
<div class="grid">
  {% for snap in snaps %}
  <div class="card">
    <a href="/snapshots/{{ snap }}" target="_blank">
      <img src="/snapshots/{{ snap }}" loading="lazy" alt="{{ snap }}">
    </a>
    <div class="ts">{{ snap|format_ts }}</div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty">No snapshots yet</div>
{% endif %}

</body>
</html>
