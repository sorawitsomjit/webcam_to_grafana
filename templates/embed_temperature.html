<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
  .wrap { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 10px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: .8rem; color: #888; flex: 1; }
  .val { font-family: monospace; font-size: 1.1rem; color: #42a5f5; font-weight: 700; }
  .badge { padding: 2px 8px; border-radius: 8px; font-size: .65rem; font-weight: 700; }
  .badge-ok  { background: #1b5e20; color: #a5d6a7; }
  .badge-off { background: #333; color: #666; }
  .chart-wrap { flex: 1; position: relative; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="title">LakeShore 336 — Temperature A</span>
    <span class="val" id="cur">— K</span>
    <span class="badge badge-off" id="badge">● —</span>
  </div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
</div>
<script>
Chart.defaults.color = '#555';
Chart.defaults.borderColor = '#1e1e1e';

const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      data: [],
      borderColor: '#42a5f5',
      backgroundColor: 'rgba(66,165,245,.08)',
      pointBackgroundColor: '#42a5f5',
      pointRadius: 2,
      tension: 0.25,
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: { ticks: { maxTicksLimit: 8, maxRotation: 30, color: '#555', font: { size: 10 } }, grid: { color: '#1e1e1e' } },
      y: { ticks: { color: '#42a5f5', font: { size: 10 } }, grid: { color: '#1e1e1e' },
           title: { display: true, text: 'K', color: '#42a5f5', font: { size: 10 } } }
    },
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: c => c.parsed.y.toFixed(2) + ' K' } }
    }
  }
});

function fmtTime(ts) {
  try {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  } catch { return ts; }
}

async function refresh() {
  try {
    const [hr, lr] = await Promise.all([
      fetch('/api/temperature/history'),
      fetch('/api/temperature/latest'),
    ]);
    const pts = await hr.json();
    const latest = await lr.json();

    chart.data.labels = pts.map(p => fmtTime(p.timestamp));
    chart.data.datasets[0].data = pts.map(p => parseFloat(p.input_a_K) || null);
    chart.update('none');

    const ok = latest.status === 'connected';
    document.getElementById('badge').textContent = ok ? '● Connected' : '● Disconnected';
    document.getElementById('badge').className = 'badge ' + (ok ? 'badge-ok' : 'badge-off');
    if (latest.input_a_K) {
      document.getElementById('cur').textContent = parseFloat(latest.input_a_K).toFixed(2) + ' K';
    }
  } catch {}
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
